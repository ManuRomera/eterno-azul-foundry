name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existente (vX.Y.Z)'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validar tag, manifest y código
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: npm run check
      - run: npm test
      - run: npm run build
      - name: Inspeccionar artefacto
        run: |
          unzip -t dist/eterno-azul.zip
          test "$(unzip -p dist/eterno-azul.zip eterno-azul/system.json | jq -r .id)" = eterno-azul
          ! unzip -Z1 dist/eterno-azul.zip | grep -E 'node_modules|\.private|\.git/|tests/'
      - name: Extraer notas
        run: node scripts/release-notes.mjs
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/eterno-azul.zip dist/system.json dist/SHA256SUMS --verify-tag --prerelease --title "Eterno Azul $RELEASE_TAG" --notes-file dist/notes.md
